<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="cyberCore" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#071b12" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#020908" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />
    </radialGradient>

    <radialGradient id="glowPoint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00bf63" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00bf63" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00bf63" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#1e3a8a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="circuitGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(0, 191, 99, 0.08)" stroke-width="1" />
      <circle cx="60" cy="0" r="1.5" fill="rgba(0, 191, 99, 0.25)" />
      <circle cx="0" cy="60" r="1.5" fill="rgba(0, 191, 99, 0.25)" />
    </pattern>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bf63" stop-opacity="0" />
      <stop offset="50%" stop-color="#00bf63" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Deep Canvas -->
  <rect width="1920" height="1080" fill="#000000" />
  <rect width="1920" height="1080" fill="url(#cyberCore)" />
  <rect width="1920" height="1080" fill="url(#circuitGrid)" />

  <!-- Ambient Glow Blobs -->
  <circle cx="960" cy="540" r="500" fill="url(#glowPoint)" />
  <circle cx="350" cy="300" r="350" fill="url(#blueGlow)" />
  <circle cx="1600" cy="700" r="400" fill="url(#glowPoint)" />

  <!-- System Architecture Bus Lines & Data Traces -->
  <g stroke="#00bf63" stroke-width="1.5" opacity="0.4" fill="none">
    <!-- Top Left to Center -->
    <path d="M 100 150 L 400 150 L 550 300 L 850 300 L 960 450" />
    <circle cx="400" cy="150" r="4" fill="#00bf63" />
    <circle cx="550" cy="300" r="3" fill="#00bf63" />
    <circle cx="850" cy="300" r="5" fill="#00bf63" />

    <!-- Top Right to Center -->
    <path d="M 1820 180 L 1500 180 L 1380 320 L 1100 320 L 960 450" stroke="#3b82f6" />
    <circle cx="1500" cy="180" r="4" fill="#3b82f6" />
    <circle cx="1380" cy="320" r="4" fill="#3b82f6" />

    <!-- Bottom Left Traces -->
    <path d="M 120 900 L 450 900 L 600 750 L 900 750 L 960 630" />
    <circle cx="450" cy="900" r="4" fill="#00bf63" />
    <circle cx="600" cy="750" r="4" fill="#00bf63" />
    <circle cx="900" cy="750" r="5" fill="#00bf63" />

    <!-- Bottom Right Traces -->
    <path d="M 1800 880 L 1480 880 L 1320 720 L 1050 720 L 960 630" stroke="#10b981" />
    <circle cx="1480" cy="880" r="4" fill="#10b981" />
    <circle cx="1320" cy="720" r="4" fill="#10b981" />
  </g>

  <!-- Central Holographic Core Matrix -->
  <g transform="translate(960, 540)" opacity="0.65">
    <!-- Concentric Hexagons -->
    <polygon points="0,-160 138,-80 138,80 0,160 -138,80 -138,-80" fill="none" stroke="#00bf63" stroke-width="2" stroke-dasharray="10 5" />
    <polygon points="0,-220 190,-110 190,110 0,220 -190,110 -190,-110" fill="none" stroke="rgba(0, 191, 99, 0.3)" stroke-width="1.5" />
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="rgba(0, 191, 99, 0.05)" stroke="#00bf63" stroke-width="1.5" />
    
    <!-- Central Kernel Core Rings -->
    <circle cx="0" cy="0" r="50" fill="#000000" stroke="#00bf63" stroke-width="2" />
    <circle cx="0" cy="0" r="35" fill="rgba(0, 191, 99, 0.2)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 3" />
    <circle cx="0" cy="0" r="12" fill="#00bf63" />
    
    <!-- Crosshair Target -->
    <line x1="-260" y1="0" x2="-60" y2="0" stroke="rgba(0, 191, 99, 0.4)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="60" y1="0" x2="260" y2="0" stroke="rgba(0, 191, 99, 0.4)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="-260" x2="0" y2="-60" stroke="rgba(0, 191, 99, 0.4)" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="60" x2="0" y2="260" stroke="rgba(0, 191, 99, 0.4)" stroke-width="1" stroke-dasharray="4 4" />
  </g>

  <!-- Network Cluster Nodes -->
  <g fill="#000000" stroke="#00bf63" stroke-width="2">
    <!-- Node 1 -->
    <circle cx="320" cy="420" r="18" />
    <circle cx="320" cy="420" r="6" fill="#00bf63" />
    <line x1="338" y1="420" x2="480" y2="480" stroke="rgba(0,191,99,0.35)" stroke-dasharray="3 3" />
    
    <!-- Node 2 -->
    <circle cx="480" cy="480" r="14" stroke="#3b82f6" />
    <circle cx="480" cy="480" r="4" fill="#3b82f6" />

    <!-- Node 3 -->
    <circle cx="1600" cy="400" r="20" stroke="#00bf63" />
    <circle cx="1600" cy="400" r="7" fill="#00bf63" />
    <line x1="1580" y1="400" x2="1420" y2="460" stroke="rgba(0,191,99,0.35)" stroke-dasharray="3 3" />

    <!-- Node 4 -->
    <circle cx="1420" cy="460" r="14" stroke="#10b981" />
    <circle cx="1420" cy="460" r="4" fill="#10b981" />
  </g>

  <!-- High-Tech Tech Code / Memory Annotations Overlay -->
  <g font-family="monospace" font-size="12" fill="rgba(0, 191, 99, 0.45)">
    <text x="80" y="100">SYS_ADDR // 0x7FFF004B8A</text>
    <text x="80" y="120">STATUS: DISTRIBUTED_CONSENSUS_ACTIVE</text>
    <text x="1620" y="100" text-anchor="end">KERNEL_VIRT_PAGING // ACTIVE</text>
    <text x="1620" y="120" text-anchor="end">HOP_LATENCY: 0.42ms [BGP ROUTE]</text>
    <text x="80" y="980">NETRIUM_ENGINE // LAB_MODE_v2.6</text>
    <text x="1620" y="980" text-anchor="end">REALTIME_EXECUTION_STREAM // CONNECTED</text>
  </g>
</svg>
