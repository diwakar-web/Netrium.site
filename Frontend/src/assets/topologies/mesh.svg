<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <radialGradient id="meshCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="meshLinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="meshGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Center Ambient Mesh Glow (Transparent Background) -->
  <circle cx="400" cy="260" r="180" fill="url(#meshCenterGlow)" />

  <!-- 10 DEDICATED FULL-MESH POINT-TO-POINT LINKS: L = N*(N-1)/2 = 10 -->
  <!-- Node 1: (400, 75)
       Node 2: (640, 190)
       Node 3: (550, 420)
       Node 4: (250, 420)
       Node 5: (160, 190) -->
  <g stroke="rgba(245, 158, 11, 0.35)" stroke-width="2">
    <!-- Outer Pentagon Links -->
    <line x1="400" y1="75" x2="640" y2="190" stroke="#f59e0b" stroke-width="3" />
    <line x1="640" y1="190" x2="550" y2="420" stroke="#f59e0b" stroke-width="3" />
    <line x1="550" y1="420" x2="250" y2="420" stroke="#f59e0b" stroke-width="3" />
    <line x1="250" y1="420" x2="160" y2="190" stroke="#f59e0b" stroke-width="3" />
    <line x1="160" y1="190" x2="400" y2="75" stroke="#f59e0b" stroke-width="3" />

    <!-- Inner Star Diagonal Links (Guarantees Full Interconnection) -->
    <line x1="400" y1="75" x2="550" y2="420" stroke="rgba(251, 191, 36, 0.45)" stroke-dasharray="6 4" />
    <line x1="400" y1="75" x2="250" y2="420" stroke="rgba(251, 191, 36, 0.45)" stroke-dasharray="6 4" />
    <line x1="640" y1="190" x2="250" y2="420" stroke="rgba(251, 191, 36, 0.45)" stroke-dasharray="6 4" />
    <line x1="640" y1="190" x2="160" y2="190" stroke="rgba(251, 191, 36, 0.45)" stroke-dasharray="6 4" />
    <line x1="550" y1="420" x2="160" y2="190" stroke="rgba(251, 191, 36, 0.45)" stroke-dasharray="6 4" />
  </g>

  <!-- Glowing Active Path Example (Node 1 to Node 3) -->
  <line x1="400" y1="75" x2="550" y2="420" stroke="#fbbf24" stroke-width="4" filter="url(#meshGlow)" />
  <circle cx="475" cy="247" r="5" fill="#ffffff" filter="url(#meshGlow)" />

  <!-- 5 Nodes with N-1 = 4 Interface Ports each -->
  <!-- Node 1 (Top: 400, 75) -->
  <g transform="translate(400, 75)">
    <circle cx="0" cy="0" r="32" fill="#1c1306" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="0" cy="0" r="25" fill="#0d0802" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">NODE 1</text>
    <text y="-40" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">Core Router Alpha</text>
    <text y="-28" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f59e0b" text-anchor="middle">4 Dedicated Ports</text>
  </g>

  <!-- Node 2 (Top-Right: 640, 190) -->
  <g transform="translate(640, 190)">
    <circle cx="0" cy="0" r="30" fill="#1c1306" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="0" cy="0" r="23" fill="#0d0802" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">NODE 2</text>
    <text x="38" y="-6" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="start">Core Router Beta</text>
    <text x="38" y="8" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f59e0b" text-anchor="start">4 Dedicated Ports</text>
  </g>

  <!-- Node 3 (Bottom-Right: 550, 420) -->
  <g transform="translate(550, 420)">
    <circle cx="0" cy="0" r="30" fill="#1c1306" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="0" cy="0" r="23" fill="#0d0802" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">NODE 3</text>
    <text y="44" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">Core Router Gamma</text>
    <text y="56" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f59e0b" text-anchor="middle">4 Dedicated Ports</text>
  </g>

  <!-- Node 4 (Bottom-Left: 250, 420) -->
  <g transform="translate(250, 420)">
    <circle cx="0" cy="0" r="30" fill="#1c1306" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="0" cy="0" r="23" fill="#0d0802" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">NODE 4</text>
    <text y="44" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="middle">Core Router Delta</text>
    <text y="56" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f59e0b" text-anchor="middle">4 Dedicated Ports</text>
  </g>

  <!-- Node 5 (Top-Left: 160, 190) -->
  <g transform="translate(160, 190)">
    <circle cx="0" cy="0" r="30" fill="#1c1306" stroke="#f59e0b" stroke-width="2.5" />
    <circle cx="0" cy="0" r="23" fill="#0d0802" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">NODE 5</text>
    <text x="-38" y="-6" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#e2e8f0" text-anchor="end">Core Router Epsilon</text>
    <text x="-38" y="8" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#f59e0b" text-anchor="end">4 Dedicated Ports</text>
  </g>

  <!-- Center Metric Callout -->
  <text x="400" y="255" font-family="'Outfit', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">FULL MESH TOPOLOGY</text>
  <text x="400" y="272" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24" text-anchor="middle">L = [N*(N-1)]/2 = 10 Dedicated Links</text>
  <text x="400" y="495" font-family="'Outfit', sans-serif" font-size="11.5" font-weight="600" fill="#94a3b8" text-anchor="middle">
    99.999% Fault Tolerance · Multiple Redundant Failover Paths · O(1) Direct Hop Delivery
  </text>
</svg>
